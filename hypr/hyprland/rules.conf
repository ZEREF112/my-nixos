# OPACITY
#windowrule = opacity 0.99 0.8, tag:browser*
#windowrule = opacity 0.9 0.8, tag:projects*
windowrule = opacity 0.94 0.86, match:tag im*
windowrule = opacity 0.94 0.86, match:tag multimedia*
windowrule = opacity 0.9 0.8, match:tag file-manager*
windowrule = opacity 0.95 0.9, match:tag terminal*
windowrule = opacity 0.8 0.7, match:tag settings*
windowrule = opacity 0.9 0.7, match:tag wallpaper*
windowrule = opacity 0.8 0.7, match:class ^(gedit|org.gnome.TextEditor|mousepad)$
windowrule = opacity 0.9 0.8, match:class ^(deluge)$
windowrule = opacity 0.9 0.8, match:class ^(seahorse)$ # gnome-keyring gui
#windowrule = opacity 0.95 0.75, title:^(Picture-in-Picture)$
windowrule = opacity 0.8, match:class ^(code)$

# MY APPS SIZE
windowrule = float on, center on, size (monitor_w*0.3) (monitor_h*0.6), match:class ^(virt-manager)$
windowrule = float on, center on, size (monitor_w*0.3) (monitor_h*0.6), match:class ^(protonvpn-app)$
windowrule = float on, center on, size (monitor_w*0.4) (monitor_h*0.4), match:class ^(xyz.ketok.Speedtest)$
windowrule = float on, center on, match:title ^(.*Network Manager.*)$
windowrule = float on, center on, size (monitor_w*0.2) (monitor_h*0.1), match:class ^(tuned-gui)$
windowrule = float on, size (monitor_w*0.98) (monitor_h*0.93), match:class ^(Noi)$
windowrule = size (monitor_w*0.5) (monitor_h*0.7), match:class ^(io.missioncenter.MissionCenter)$
