
# ######## Window rules ########

# Uncomment to apply global transparency to all windows:
# windowrulev2 = opacity 0.89 override 0.89 override, class:.*


# ==================
# WINDOW RULES
# ==================
windowrule = tile on, border_size 0, match:class ^(org\.wezfurlong\.wezterm)$

windowrule = rounding 12, border_size 0, match:class ^(org\.gnome\.)

windowrule = tile on, match:class ^(gnome-control-center)$
windowrule = tile on, float on, size (monitor_w*0.45), center on, match:class ^(pavucontrol)$
windowrule = tile on, float on, size (monitor_w*0.45), center on, match:class ^(nm-connection-editor)$

windowrule = float on, match:class ^(gnome-calculator)$
windowrule = float on, match:class ^(galculator)$
windowrule = float on, match:class ^(blueman-manager)$
#windowrulev2 = float, class:^(org\.gnome\.Nautilus)$
windowrule = float on, match:class ^(steam)$
windowrule = float on, match:class ^(xdg-desktop-portal)$

windowrule = border_size 0, match:class ^(Alacritty)$
windowrule = border_size 0, match:class ^(zen)$
windowrule = border_size 0, match:class ^(com\.mitchellh\.ghostty)$
windowrule = border_size 0, match:class ^(kitty)$

windowrule = float on, match:class ^(firefox)$, match:title ^(Picture-in-Picture)$
windowrule = float on, match:class ^(zoom)$

# DMS windows floating by default
windowrule = float on, match:class ^(org.quickshell)$
windowrule = opacity 0.9 0.9, match:float 0, match:focus 0

layerrule = no_anim on, match:namespace ^(quickshell)$

#============================================#

# Disable blur for xwayland context menus
windowrule = no_blur on, match:class ^()$, match:title ^()$
# Disable blur for all xwayland apps
# windowrulev2 = noblur, xwayland:1
# Disable blur for every window
windowrule = no_blur on, match:class .*

# Floating
windowrule = center on, float on, match:title ^(Open File)(.*)$
windowrule = center on, float on, match:title ^(Select a File)(.*)$
windowrule = center on, float on, size (monitor_w*0.6) (monitor_h*0.65), match:title ^(Choose wallpaper)(.*)$
windowrule = center on, float on, match:title ^(Open Folder)(.*)$
windowrule = center on, float on, match:title ^(Save As)(.*)$
windowrule = center on, float on, match:title ^(Library)(.*)$
windowrule = center on, float on, match:title ^(File Upload)(.*)$
windowrule = center on, float on, match:title ^(.*)(wants to save)$
windowrule = center on, float on, match:title ^(.*)(wants to open)$
windowrule = float on, match:class ^(blueberry\.py)$
windowrule = float on, match:class ^(guifetch)$   # FlafyDev/guifetch
windowrule = float on, size (monitor_w*0.45), center on, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = float on, match:class .*plasmawindowed.*
windowrule = float on, match:class kcm_.*
windowrule = float on, match:class .*bluedevilwizard
windowrule = float on, match:title .*Shell conflicts.*
windowrule = float on, size (monitor_w*0.6) (monitor_h*0.65), match:class org.freedesktop.impl.portal.desktop.kde
windowrule = float on, size (monitor_w*0.45), match:class ^(Zotero)$


# My-Config

# windowrule - tags - add apps under appropriate tag to use the same settings
# browser tags
windowrule = tag +browser, match:class ^([Ff]irefox|org.mozilla.firefox|[Ff]irefox-esr|[Ff]irefox-bin)$
windowrule = tag +browser, match:class ^([Gg]oogle-chrome(-beta|-dev|-unstable)?)$
windowrule = tag +browser, match:class ^(chrome-.+-Default)$ # Chrome PWAs
windowrule = tag +browser, match:class ^([Cc]hromium)$
windowrule = tag +browser, match:class ^([Mm]icrosoft-edge(-stable|-beta|-dev|-unstable))$
windowrule = tag +browser, match:class ^(Brave-browser(-beta|-dev|-unstable)?)$
windowrule = tag +browser, match:class ^([Tt]horium-browser|[Cc]achy-browser)$
windowrule = tag +browser, match:class ^(zen-alpha|zen)$

# terminal tags
windowrule = tag +terminal, match:class ^(Alacritty|kitty|kitty-dropterm)$

# email tags
windowrule = tag +email, match:class ^([Tt]hunderbird|org.gnome.Evolution)$
windowrule = tag +email, match:class ^(eu.betterbird.Betterbird)$

# project tags
windowrule = tag +projects, match:class ^(codium|codium-url-handler|VSCodium)$
windowrule = tag +projects, match:class ^(VSCode|code-url-handler)$
windowrule = tag +projects, match:class ^(jetbrains-.+)$ # JetBrains IDEs

# screenshare tags
windowrule = tag +screenshare, match:class ^(com.obsproject.Studio)$

# IM tags
windowrule = tag +im, match:class ^([Dd]iscord|[Ww]ebCord|[Vv]esktop)$
windowrule = tag +im, float on, size (monitor_w*0.6) (monitor_h*0.7), match:class ^([Ff]erdium)$
windowrule = tag +im, match:class ^([Ww]hatsapp-for-linux)$
windowrule = tag +im, match:class ^(ZapZap|com.rtosta.zapzap)$
windowrule = tag +im, match:class ^(org.telegram.desktop|io.github.tdesktop_x64.TDesktop)$
windowrule = tag +im, match:class ^(teams-for-linux)$
windowrule = tag +im, match:class ^(im.riot.Riot|Element)$ # Element Matrix client

# game tags
windowrule = tag +games, match:class ^(gamescope)$
windowrule = tag +games, match:class ^(steam_app_\d+)$

# gamestore tags
windowrule = tag +gamestore, match:class ^([Ss]team)$
windowrule = tag +gamestore, match:title ^([Ll]utris)$
windowrule = tag +gamestore, match:class ^(com.heroicgameslauncher.hgl)$

# file-manager tags
windowrule = tag +file-manager, match:class ^([Tt]hunar|org.gnome.Nautilus|[Pp]cmanfm-qt)$
windowrule = tag +file-manager, match:class ^(app.drey.Warp)$

# wallpaper tags
windowrule = tag +wallpaper, match:class ^([Ww]aytrogen)$

# multimedia tags
windowrule = tag +multimedia, match:class ^([Aa]udacious)$

# multimedia-video tags
windowrule = tag +multimedia_video, match:class ^([Mm]pv|vlc)$

# viewer tags
windowrule = tag +viewer, match:class ^(gnome-system-monitor|org.gnome.SystemMonitor|io.missioncenter.MissionCenter)$ # system monitor
windowrule = tag +viewer, match:class ^(evince)$ # document viewer
windowrule = tag +viewer, match:class ^(eog|org.gnome.Loupe)$ # image viewer

# Some special override rules
windowrule = no_blur on, opacity 1.0, match:tag multimedia_video*
 

#windowrule to avoid idle for fullscreen apps
